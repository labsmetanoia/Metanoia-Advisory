# Netlify build settings (Cloudflare Pages and Vercel work the same way: build "npm run build", publish "_site").
[build]
  command = "npm run build"
  publish = "_site"
  # Pushes that only touch the local tools or the documentation do not rebuild the site (saves build credits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)tools' ':(exclude)docs'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
